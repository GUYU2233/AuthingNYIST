# Security templates are retained; their jobs use their own analyzer images.
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

image: golang:1.26-bookworm

stages:
  - test
  - secret-detection
  - native
  - build
  - publish

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # Campus runners cannot reliably reach proxy.golang.org. Pipe fallback also
  # covers transport errors; checksum verification remains enabled via sumdb.
  GOPROXY: 'https://goproxy.cn|https://proxy.golang.org|direct'
  GOMODCACHE: '$CI_PROJECT_DIR/.cache/go-mod'
  GOCACHE: '$CI_PROJECT_DIR/.cache/go-build'

.go_cache:
  cache:
    key:
      prefix: go-1.26-linux
      files:
        - go.sum
    paths:
      - .cache/go-mod/
      - .cache/go-build/

sast:
  stage: test

# Image-pull failures happen before the analyzer starts. Retry infrastructure
# failures only; do not retry or suppress findings from a completed scan.
semgrep-sast:
  retry:
    max: 2
    when: runner_system_failure

secret_detection:
  stage: secret-detection
  retry:
    max: 2
    when: runner_system_failure

test_linux:
  extends: .go_cache
  stage: test
  script:
    - go mod download
    - go mod verify
    - go test -count=1 ./...
    - go test -race ./internal/...
    - go vet ./...
    - for script in scripts/*.sh oneclick/*.sh; do bash -n "$script"; done
    - |
      files=$(gofmt -l cmd internal cli libauth/requests.go)
      if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi

# Opt in only after registering a trusted macOS shell runner tagged 'macos'.
# Runner host prerequisites: Go 1.26+, Xcode Command Line Tools, macOS 13+.
macos_package:
  stage: native
  tags: [macos]
  rules:
    - if: '$ENABLE_MACOS_RUNNER == "true"'
    - when: never
  script:
    - test "$(uname -s)" = Darwin
    - go version
    - xcode-select -p
    - go mod download
    - go mod verify
    - go test -count=1 ./...
    - go vet ./...
    - bash scripts/build-macos.sh
  artifacts:
    name: 'authingnyist-macos-$CI_COMMIT_REF_SLUG'
    paths:
      - dist/NYIST-Connect-macos-*.dmg
    expire_in: 14 days

build_release:
  extends: .go_cache
  stage: build
  script:
    - go mod download
    - bash scripts/build-unix.sh
    - |
      if [ "${ENABLE_MACOS_RUNNER:-false}" = true ]; then
        REQUIRE_MACOS_DMG=1 bash scripts/package-release.sh
      else
        bash scripts/package-release.sh
      fi
  artifacts:
    name: 'authingnyist-$CI_COMMIT_REF_SLUG'
    paths:
      - dist/
    expire_in: 7 days

publish_release:
  stage: publish
  needs:
    - job: build_release
      artifacts: true
  # Serialize retries/pipelines for the same tag when creating release links.
  resource_group: 'release-$CI_COMMIT_REF_SLUG'
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends curl python3 ca-certificates
  script:
    - bash scripts/gitlab-release.sh
