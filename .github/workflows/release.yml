name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/go.yml
    permissions:
      contents: read

  publish:
    name: Publish tested binaries
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Verify and publish assets (safe to retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt
          assets=()
          while IFS= read -r file; do
            [[ "$file" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid asset name' >&2; exit 1; }
            test -s "$file"
            assets+=("$file")
          done < release-assets.txt
          test "${#assets[@]}" -gt 0
          notes_file="$GITHUB_WORKSPACE/releases/$GITHUB_REF_NAME.md"
          notes=(--generate-notes)
          if test -s "$notes_file"; then notes=(--notes-file "$notes_file"); fi
          prerelease=()
          [[ "$GITHUB_REF_NAME" != *-* ]] || prerelease=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            # Draft first: a failed upload must not publish a partial new release.
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft \
              --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}" "${prerelease[@]}"
          fi
          if test -s "$notes_file"; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_file"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "${prerelease[@]}"
