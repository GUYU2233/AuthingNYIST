name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l cmd internal cli libauth/requests.go)
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - name: Build and smoke-test Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/smoke-windows.ps1
      - name: Upload Windows GUI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: dist/nyist-connect.exe
          if-no-files-found: error

  build:
    name: Cross-platform binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Build Linux application and classic CLI
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: bash scripts/build-unix.sh
      - name: Upload Linux and classic CLI
        uses: actions/upload-artifact@v4
        with:
          name: linux-and-classic-cli
          path: dist/*
          if-no-files-found: error
