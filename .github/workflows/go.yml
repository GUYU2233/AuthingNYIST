name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting and shell syntax
        shell: bash
        run: |
          files=$(gofmt -l cmd internal libauth/requests.go)
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Test packaging, cask, completions, and release allowlist
        if: runner.os == 'Linux'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packaging/recipes -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packaging/homebrew -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packaging/completions -v
          bash scripts/package-sandbox.sh test
          bash scripts/test-release-assets.sh
      - name: Race test shared core and platform
        if: runner.os == 'Linux'
        run: go test -race ./internal/...
      - name: Build and smoke-test Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/smoke-windows.ps1
      - name: Upload native Windows GUI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-smoke-tested
          path: dist/nyist-connect.exe
          retention-days: 7
          if-no-files-found: error

  macos-package:
    name: macOS app and DMG
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build and verify macOS disk images
        shell: bash
        run: |
          set -o pipefail
          if bash scripts/build-macos.sh 2>&1 | tee "$RUNNER_TEMP/macos-build.log"; then
            exit 0
          else
            status=$?
            # Surface compiler/packager diagnostics through the public Checks API.
            tail -n 40 "$RUNNER_TEMP/macos-build.log" | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              printf '::error::%s\n' "$line"
            done
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/NYIST-Connect-macos-*.dmg
          if-no-files-found: error
          retention-days: 14

  build:
    name: Release bundle
    needs: [test, macos-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build all platforms
        env:
          CGO_ENABLED: '0'
        run: bash scripts/build-unix.sh
      - name: Download macOS disk images
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist
      - name: Install distribution packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm zstd libarchive-tools apt-utils createrepo-c
      - name: Build package-manager release assets
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
        run: bash scripts/package-distributions.sh
      - name: Package and verify checksums
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
          REQUIRE_MACOS_DMG: '1'
        run: bash scripts/package-release.sh
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/release-assets.txt
            dist/SHA256SUMS.txt
            dist/*.exe
            dist/NYIST-Connect-macos-*.dmg
            dist/*.deb
            dist/*.rpm
          retention-days: 14
          if-no-files-found: error
